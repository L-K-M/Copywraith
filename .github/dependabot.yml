version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Kit imports the TS6 compiler API; TS7 runs through @typescript/native.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      svelte-bundler:
        patterns: [vite, "@sveltejs/vite-plugin-svelte", "@sveltejs/kit"]

  - package-ecosystem: npm
    directory: /server/ui
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      svelte-bundler:
        patterns: [vite, "@sveltejs/vite-plugin-svelte", "@sveltejs/kit"]
