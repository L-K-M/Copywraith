name: Native clipboard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-clipboard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Install isolated X11 display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Build adapter smoke
        run: cargo test --locked -p copywraith-server --test native_clipboard --no-run
      - name: X11 clipboard events and roundtrips
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --locked -p copywraith-server --test native_clipboard -- --ignored --nocapture
      - name: Native clipboard events and roundtrips
        if: runner.os != 'Linux'
        run: cargo test --locked -p copywraith-server --test native_clipboard -- --ignored --nocapture
