name: Android runtime probe

on:
  workflow_dispatch:
  push:
    branches: ['probe/android-runtime-*']

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-linux-android
      - name: Install build dependencies on the disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxfixes-dev libxtst-dev
          sdkmanager 'platforms;android-36' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          npm ci
      - name: Test leases and protocol cancellation
        run: cargo test --locked -p copywraith-server --test mobile_core --test android_runtime
      - name: Build app, instrumentation, and plugin tests
        run: scripts/android-runtime-probe/build.sh
      - name: Allow emulator access on the disposable runner
        run: sudo chmod a+rw /dev/kvm
      - name: Exercise the actual APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: node scripts/android-runtime-probe/run.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-runtime-evidence
          path: |
            artifacts/android-runtime/
            src-tauri/gen/android/app/build/outputs/apk/
            crates/copywraith-share-target/android/build/reports/tests/
