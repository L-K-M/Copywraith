name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# Cancel in-progress runs for the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend (check & build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # LICENSE is the Unlicense; manifests and packaging metadata must say so.
      - name: Check license statements
        run: |
          node - <<'EOF'
            const fs = require("fs");
            const read = (file) => JSON.parse(fs.readFileSync(file, "utf8"));
            const statements = {
              "package.json": read("package.json").license,
              "package-lock.json": read("package-lock.json").packages[""].license,
              "server/ui/package.json": read("server/ui/package.json").license,
              "server/ui/package-lock.json": read("server/ui/package-lock.json").packages[""].license,
              "src-tauri/tauri.conf.json bundle.license": read("src-tauri/tauri.conf.json").bundle.license
            };
            for (const [where, license] of Object.entries(statements)) {
              if (license !== "Unlicense") {
                console.error(`::error::${where} says ${license}, but LICENSE is the Unlicense`);
                process.exitCode = 1;
              }
            }
          EOF
          grep -A2 '^\[workspace.package\]' Cargo.toml | grep -qx 'license = "Unlicense"' ||
            { echo '::error::Cargo.toml [workspace.package] does not declare license = "Unlicense"'; exit 1; }
          for manifest in crates/*/Cargo.toml server/Cargo.toml src-tauri/Cargo.toml; do
            grep -qx 'license.workspace = true' "$manifest" ||
              { echo "::error::$manifest does not inherit the workspace license"; exit 1; }
          done

      - name: Install dependencies (popup frontend)
        run: npm ci

      - name: Type-check (TS7 and compiler API compatibility)
        run: |
          npm run check
          npm run check:ts6

      - name: Test popup actions and sync status
        run: npm run test:frontend

      - name: Test storage durability and Linux smoke harness
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build popup frontend
        run: npm run build

      # The build fails when a bundled package has no license text; check the
      # notices it wrote and the banner in every emitted chunk.
      - name: Check popup frontend notices
        run: |
          test -s build/Third-Party-Notices.txt
          grep -q 'SIL OPEN FONT LICENSE Version 1.1' build/Third-Party-Notices.txt
          test -n "$(find build/_app/immutable -name '*.js' -print -quit)"
          if grep -rL --include='*.js' 'Third-Party-Notices.txt' build/_app/immutable | grep .; then exit 1; fi

      - name: Install dependencies (server UI)
        run: npm ci
        working-directory: server/ui

      - name: Type-check server UI (TS7 and compiler API compatibility)
        run: |
          npm run check
          npm run check:ts6
        working-directory: server/ui

      - name: Test server UI
        run: npm run test
        working-directory: server/ui

      - name: Build server UI
        run: npm run build
        working-directory: server/ui

      - name: Check server UI notices
        run: |
          test -s dist/Third-Party-Notices.txt
          grep -q 'SIL OPEN FONT LICENSE Version 1.1' dist/Third-Party-Notices.txt
          test -n "$(find dist/assets -name '*.js' -print -quit)"
          if grep -rL --include='*.js' 'Third-Party-Notices.txt' dist/assets | grep .; then exit 1; fi
        working-directory: server/ui

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Tauri's desktop backend (src-tauri) links against the system webview
      # and GTK, so these are required to compile/clippy/test the workspace.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # src-tauri embeds the built frontend via `generate_context!`, so the
      # `build/` directory must exist before any cargo command touches it.
      - name: Build frontend (required by tauri::generate_context!)
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # Every shipped Rust binary needs its crates' license texts, and the
      # workspace members must declare the Unlicense. cargo tree resolves the
      # macOS, Windows and Android targets here without their toolchains.
      - name: Check Rust license notices
        run: |
          check() {
            python3 scripts/rust-notices.py --overrides licenses/rust-overrides.json \
              --own-license Unlicense --check "$@"
          }
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            check -p copywraith-tauri --target "$target"
          done
          check -p copywraith-tauri --target aarch64-linux-android --target armv7-linux-androideabi \
            --target i686-linux-android --target x86_64-linux-android
          check -p copywraith-server --target x86_64-unknown-linux-gnu --rust-std Rust-Licenses.html

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test GNOME shortcut registration in an isolated session
        run: |
          sudo apt-get install -y gnome-settings-daemon-common dconf-gsettings-backend dbus-x11
          config=$(mktemp -d)
          trap 'rm -rf "$config"' EXIT
          XDG_CONFIG_HOME="$config" COPYWRAITH_TEST_GSETTINGS=1 \
            dbus-run-session -- cargo test -p copywraith-tauri gnome_keybinding_round_trip

  # Exercise release-only setup actions before a tag can depend on them.
  android-tooling:
    name: Android SDK tooling
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Install release NDK
        run: bash scripts/install-android-ndk.sh

      - name: Verify release NDK installation
        run: '"$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version'

  # The Ubuntu/Linux desktop bundle is what the release workflow ships, so build
  # it here too — packaging breakage (a renamed binary, a missing icon, an
  # AppImage that will not assemble) otherwise only surfaces at tag time.
  linux-bundle:
    name: Linux bundle (deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-bundle

      - name: Install frontend dependencies
        run: npm ci

      # Same action the release workflow uses, so this catches release-time
      # packaging failures on a pull request instead of on a tag.
      - name: Build Linux bundles
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles deb,appimage

      # linuxdeploy copies GTK, WebKitGTK and other system libraries (many
      # LGPL) into the AppImage; add their copyright files, exact source
      # packages and the AppImage runtime's notices. Runs on the build host.
      - name: Add the AppImage's system library notices
        run: |
          for appimage in target/release/bundle/appimage/*.AppImage; do
            python3 scripts/appimage-notices.py appimage "$appimage" --package copywraith \
              --overrides licenses/appimage/appimage-notices.json
          done

      - name: Verify the bundle contents
        run: ./scripts/check-linux-bundle.sh

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundles
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  # Build the server image like the release does (without pushing) and check
  # the notices inside it.
  server-image:
    name: Server Docker image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          load: true
          tags: copywraith-server:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image's third-party notices
        run: |
          docker run --rm --entrypoint sh copywraith-server:check -c '
            set -e
            doc=/usr/share/doc/copywraith-server
            for f in Third-Party-Notices.txt Rust-Licenses.html LICENSE; do test -s "$doc/$f"; done
            grep -q "^axum [0-9]" "$doc/Third-Party-Notices.txt"
            grep -q "Third-party notices for Copywraith server UI" "$doc/Third-Party-Notices.txt"
            grep -q "SIL OPEN FONT LICENSE Version 1.1" "$doc/Third-Party-Notices.txt"
            grep -q "Copyright notices for The Rust Standard Library" "$doc/Rust-Licenses.html"
            test -s /ui/dist/Third-Party-Notices.txt
          '

  # Repack the same .deb as a Flatpak bundle — identical files under /app,
  # so this exercises the packaging path without a second toolchain build.
  linux-flatpak:
    name: Linux Flatpak bundle
    needs: linux-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Download the Linux bundles
        uses: actions/download-artifact@v8
        with:
          name: linux-bundles
          path: dist/flatpak-deb/

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y flatpak flatpak-builder elfutils
          # Ubuntu 24.04 denies the unprivileged user namespaces bubblewrap
          # (flatpak's sandbox helper) builds in.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true   # absent on kernels without the knob

      - name: Repack .deb as Flatpak bundle
        # The artifact keeps the upload's directory layout — find the .deb
        # wherever it landed rather than assuming the top level.
        run: |
          mapfile -t DEBS < <(find dist/flatpak-deb -type f -name '*.deb')
          [ "${#DEBS[@]}" -eq 1 ] || { echo "::error::expected exactly one .deb in linux-bundles artifact, got ${#DEBS[@]}:" >&2; printf '%s\n' "${DEBS[@]}" >&2; exit 1; }
          DEB="${DEBS[0]}"
          ./scripts/build-flatpak.sh "$DEB"

      - name: Checksum and upload Flatpak bundle
        run: |
          for f in dist/*.flatpak; do
            (cd dist && sha256sum "$(basename "$f")" > "$(basename "$f").sha256")
          done
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: linux-flatpak
          path: |
            dist/*.flatpak
            dist/*.flatpak.sha256
          if-no-files-found: error
          retention-days: 7

  # Test the installed package without the build job's development libraries.
  linux-smoke:
    name: Ubuntu client smoke (${{ matrix.platform }})
    needs: linux-bundle
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-bundles
          path: linux-bundles

      - name: Install the deb and desktop test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ./linux-bundles/deb/*.deb \
            xvfb xauth xclip xdotool openbox dbus-x11 scrot

      - name: Exercise the installed client
        env:
          COPYWRAITH_SMOKE_ARTIFACTS: linux-smoke-results
        run: python3 scripts/smoke-linux-client.py

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-smoke-${{ matrix.platform }}
          path: linux-smoke-results
          retention-days: 7
